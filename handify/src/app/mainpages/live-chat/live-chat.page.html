<ion-header class="custom-header">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="chevron-back-outline" color="light"></ion-icon>
      </ion-button>
    </ion-buttons>

    <div class="header-profile-container">
      <div class="avatar-wrapper purple-placeholder">
        <img *ngIf="receiverImage && receiverImage !== 'assets/imgs/default-avatar.png'" [src]="receiverImage" alt="User Avatar" />
        <ion-icon *ngIf="!receiverImage || receiverImage === 'assets/imgs/default-avatar.png'" name="person" color="light"></ion-icon>
      </div>
      <div class="user-info">
        <div class="receiver-name">{{ receiverName }}</div>
        <span class="status-indicator">Live Chat</span>
      </div>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="chat-content">
  <div class="chat-container">
    <!-- If no booking ID, show a prompt to select a booking -->
    <div *ngIf="!bookingId" class="no-booking-container">
      <div class="no-booking-card">
        <ion-icon name="chatbubbles-outline"></ion-icon>
        <h3>No Booking Selected</h3>
        <p>To chat with a professional or customer, please select an active request from your list.</p>
        <ion-button expand="block" (click)="goToRequests()">Go to My Requests</ion-button>
      </div>
    </div>

    <div class="messages-container" *ngIf="bookingId">
      <div *ngFor="let message of messages"
           [ngClass]="{'message-container': true, 'user-message': message.senderId === currentUserId, 'agent-message': message.senderId !== currentUserId}">
        
        <div class="message-bubble">
          {{ message.text }}
          <div class="message-time">{{ message.timestamp | date:'shortTime' }}</div>
        </div>
      </div>
    </div>
    
    <div *ngIf="bookingId && !loading && messages.length === 0" class="welcome-container">
      <div class="welcome-bubble">
        <div class="welcome-text">Hi! Start chatting about your booking here.</div>
      </div>
    </div>
  </div>
</ion-content>

<div class="input-container" *ngIf="bookingId">
  <div class="input-wrapper">
    <input style="color: #000; background-color: #fff;"
           type="text"
           [placeholder]="translationService.translate('typeYourMessageHere')"
           [(ngModel)]="newMessage"
           (keyup.enter)="sendMessage()">
    <ion-icon name="send-outline" class="input-icon send-icon" (click)="sendMessage()"></ion-icon>
  </div>
</div>
